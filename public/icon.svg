<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fond" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6a2fd6"/>
      <stop offset="0.6" stop-color="#2d1066"/>
      <stop offset="1" stop-color="#1a0b3d"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="50%">
      <stop offset="0" stop-color="#ffc83d" stop-opacity=".45"/>
